{% extends "base.html" %}
{% block title %}سامانه مدیریت دبیرستان{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card text-center">
        <div class="logo-circle mx-auto mb-3" style="width:64px;height:64px;background:var(--brand);border-radius:18px;display:flex;align-items:center;justify-content:center;">
            <i class="bi bi-mortarboard-fill text-white fs-2"></i>
        </div>
        <h3 class="fw-bold">سامانه مدیریت دبیرستان</h3>
        <p class="text-muted">مدیریت یکپارچه دانش‌آموزان، معلمان، کلاس‌ها، نمرات و حضور و غیاب</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-brand w-100 py-2 fw-bold mt-2">ورود به سیستم</a>
    </div>
</div>
{% endblock %}
