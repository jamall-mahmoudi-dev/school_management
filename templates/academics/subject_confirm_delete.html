{% extends "base.html" %}
{% block title %}حذف درس{% endblock %}
{% block page_title %}حذف درس{% endblock %}
{% block content %}
<div class="card" style="max-width:500px">
    <div class="card-body text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
        <p class="mt-3">آیا از حذف درس «{{ object }}» مطمئن هستید؟</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> حذف</button>
            <a href="{% url 'academics:subject_list' %}" class="btn btn-outline-secondary">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
