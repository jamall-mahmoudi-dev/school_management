{% extends "base.html" %}
{% block title %}ورود به سیستم{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo-circle mx-auto mb-2" style="width:56px;height:56px;background:var(--brand);border-radius:16px;display:flex;align-items:center;justify-content:center;">
                <i class="bi bi-mortarboard-fill text-white fs-3"></i>
            </div>
            <h4 class="fw-bold mb-0">سامانه مدیریت دبیرستان</h4>
            <p class="text-muted small">برای ورود اطلاعات حساب خود را وارد کنید</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">نام کاربری</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">رمز عبور</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">ورود</button>
        </form>
    </div>
</div>
{% endblock %}
